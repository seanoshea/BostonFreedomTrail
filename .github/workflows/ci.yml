name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.7
        bundler-cache: true
    
    - name: Install dependencies
      run: |
        bundle install
        pod install
    
    - name: Run tests
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      run: bundle exec fastlane test
    
    - name: Debug test output
      if: success()
      run: |
        echo "Contents of test_output directory:"
        ls -la ./test_output/ || echo "test_output directory not found"
        echo "Looking for xcresult files:"
        find . -name "*.xcresult" -type d 2>/dev/null || echo "No xcresult files found"
    
    - name: Export coverage data
      if: success()
      run: |
        XCRESULT_PATH=$(find . -name "*.xcresult" -type d | head -1)
        if [ -n "$XCRESULT_PATH" ] && [ -d "$XCRESULT_PATH" ]; then
          echo "Found xcresult at: $XCRESULT_PATH"
          xcrun xccov view --report --json "$XCRESULT_PATH" > ./test_output/coverage.json
        else
          echo "No xcresult bundle found, skipping coverage export"
        fi
    
    - name: Upload coverage to Codecov
      if: success() && hashFiles('./test_output/coverage.json') != ''
      uses: codecov/codecov-action@v4
      with:
        files: ./test_output/coverage.json
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test_output/