# SwiftLint Configuration for Boston Freedom Trail
# Updated for Swift 6 and modern best practices

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
  # Documentation and security rules
  - missing_docs
  - private_over_fileprivate
  - strict_fileprivate
  - unused_private_declaration
  # Performance rules
  - reduce_into
  - contains_over_first_not_nil

disabled_rules:
  - identifier_name  # Allow short names like 'i', 'x', 'y'
  - force_cast       # Sometimes necessary for legacy code
  - force_try        # Sometimes necessary for known-safe operations

excluded:
  - Carthage
  - Pods
  - DerivedData
  - .build
  - vendor

line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 3
    error: 6
  function_level:
    warning: 5
    error: 10

type_name:
  min_length: 3
  max_length:
    warning: 40
    error: 50
  excluded:
    - iPhone
    - URL
    - ID

reporter: "xcode"
